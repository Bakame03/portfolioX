<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Alien code mark">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="78%">
      <stop offset="0" stop-color="#111c39"/><stop offset="1" stop-color="#05070f"/>
    </radialGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4a63"/><stop offset="1" stop-color="#141c30"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b06bff"/><stop offset="1" stop-color="#3ad9ff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" rx="60" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="58.5" fill="none" stroke="#2de0ff" stroke-opacity="0.22" stroke-width="2"/>

  <!-- alien head -->
  <path d="M128 40 C182 40 210 84 205 128 C201 166 168 200 128 214 C88 200 55 166 51 128 C46 84 74 40 128 40 Z"
        fill="url(#head)" stroke="url(#rim)" stroke-width="5.5" filter="url(#glow)"/>

  <!-- code-chevron eyes  < >  -->
  <g stroke="#5ff0ff" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M112 108 L84 130 L112 152"/>
    <path d="M144 108 L172 130 L144 152"/>
  </g>

  <!-- mouth -->
  <path d="M112 184 L144 184" stroke="#b06bff" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
</svg>
