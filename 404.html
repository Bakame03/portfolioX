<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>404 — Signal Lost | Aldo Alex NGANJI</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#faf9f5">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="icon" href="assets/img/favicon.ico" sizes="any">
  <style>
    @font-face {
      font-family: 'Source Serif 4';
      font-style: normal;
      font-weight: 600 700;
      font-display: swap;
      src: url('assets/fonts/source-serif-4-var-latin.woff2') format('woff2');
    }
    :root {
      --bg: #faf9f5;
      --ink: #262521;
      --text: #3d3a34;
      --accent: #c15f3c;
      --accent-strong: #9a4a2c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #262624;
        --ink: #f0eee9;
        --text: #d5d1c7;
        --accent: #d97757;
        --accent-strong: #e29070;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px calc(24px + env(safe-area-inset-right)) 24px calc(24px + env(safe-area-inset-left));
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: var(--bg);
      background-image: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(193, 95, 60, 0.09), transparent 60%);
      overflow: hidden;
    }
    .wrap { max-width: 560px; }
    .mark {
      width: 120px; height: 120px; margin: 0 auto 26px;
      animation: float 5s ease-in-out infinite;
    }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    h1 {
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: clamp(72px, 18vw, 128px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    h2 {
      margin-top: 10px;
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: clamp(20px, 5vw, 26px);
      font-weight: 600;
      color: var(--accent-strong);
    }
    p  { margin-top: 14px; font-size: 16px; line-height: 1.6; }
    .btn {
      display: inline-block; margin-top: 30px; padding: 13px 30px;
      font-size: 16px; font-weight: 600; text-decoration: none; color: #fff;
      background: var(--accent);
      border-radius: 40px;
      transition: background .2s ease, transform .2s ease;
    }
    .btn:hover { background: var(--accent-strong); transform: translateY(-2px); }
    @media (prefers-color-scheme: dark) { .btn { color: #1d1c1a; } }
    @media (prefers-reduced-motion: reduce) { .mark { animation: none; } .btn { transition: none; } }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="mark" src="assets/img/favicon.svg" alt="" aria-hidden="true">
    <h1>404</h1>
    <h2>Signal Lost</h2>
    <p>This page drifted somewhere into deep space — the link is broken or the page no longer exists.</p>
    <a class="btn" href="./">← Back to Earth</a>
  </div>
</body>
</html>
