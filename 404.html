<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>404 — Signal Lost | Aldo Alex NGANJI</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#080811">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="icon" href="assets/img/favicon.ico" sizes="any">
  <style>
    :root { --neon: #4df3ff; --violet: #b06bff; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px calc(24px + env(safe-area-inset-right)) 24px calc(24px + env(safe-area-inset-left));
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #e7ecf5;
      background:
        radial-gradient(1200px 600px at 50% 30%, #111c39 0%, #05070f 70%),
        #05070f;
      overflow: hidden;
    }
    .wrap { max-width: 560px; }
    .mark {
      width: 132px; height: 132px; margin: 0 auto 26px;
      filter: drop-shadow(0 0 22px rgba(77, 243, 255, 0.35));
      animation: float 5s ease-in-out infinite;
    }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    h1 {
      font-size: clamp(64px, 18vw, 118px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: 2px;
      background: linear-gradient(120deg, var(--neon), var(--violet));
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    h2 { margin-top: 10px; font-size: clamp(18px, 5vw, 24px); font-weight: 700; color: #cfe0ff; }
    p  { margin-top: 14px; font-size: 16px; line-height: 1.6; color: #8aa0c0; }
    .btn {
      display: inline-block; margin-top: 30px; padding: 14px 30px;
      font-size: 16px; font-weight: 600; text-decoration: none; color: #05070f;
      background: linear-gradient(120deg, var(--neon), #35c9ff);
      border-radius: 40px; transition: transform .2s ease, box-shadow .2s ease;
      box-shadow: 0 8px 26px rgba(53, 201, 255, 0.35);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(53, 201, 255, 0.5); }
    @media (prefers-reduced-motion: reduce) { .mark { animation: none; } .btn { transition: none; } }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="mark" src="assets/img/favicon.svg" alt="" aria-hidden="true">
    <h1>404</h1>
    <h2>Signal Lost</h2>
    <p>This page drifted somewhere into deep space — the link is broken or the page no longer exists.</p>
    <a class="btn" href="./">← Back to Earth</a>
  </div>
</body>
</html>
